<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页 | Jia Mingyuan</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body data-page="home">
    <header class="site-header">
        <div class="site-shell header-inner">
            <a class="brand" href="index.html">
                <span class="brand-mark" aria-hidden="true">JM</span>
                <span class="brand-text">
                    <strong>Jia Mingyuan</strong>
                    <small>Personal Site</small>
                </span>
            </a>
            <nav class="main-nav" aria-label="主导航">
                <a href="index.html">主页</a>
                <a href="academic.html">学术简介</a>
                <a href="cv.html">我的 CV</a>
                <a href="blog.html">我的博客</a>
                <a href="interests.html">兴趣页</a>
            </nav>
        </div>
    </header>

    <main class="site-shell page-main">
        <section class="hero reveal">
            <div class="hero-copy">
                <p class="eyebrow">个人主页</p>
                <h1>明日远方的诗与酒</h1>
                <p class="lead">
                    你好，我是贾明远。这里会记录我的学术探索、成长轨迹、博客杂谈和兴趣收藏。
                    整个站点采用可扩展的多页面结构，便于后续持续维护。
                </p>

                <section class="sudoku-panel" aria-label="数独小游戏">
                    <div class="sudoku-controls">
                        <div class="difficulty-group" role="group" aria-label="数独难度">
                            <button class="btn ghost compact difficulty-btn is-active" data-difficulty="easy" type="button">简单</button>
                            <button class="btn ghost compact difficulty-btn" data-difficulty="medium" type="button">中等</button>
                            <button class="btn ghost compact difficulty-btn" data-difficulty="hard" type="button">困难</button>
                        </div>
                        <button id="newSudokuGame" class="btn compact" type="button">新开一局</button>
                    </div>
                    <p id="sudokuStatus" class="sudoku-status" aria-live="polite"></p>
                    <div id="sudokuBoard" class="sudoku-board" role="grid" aria-label="九宫格数独棋盘"></div>
                </section>
            </div>

            <div class="hero-visual">
                <div class="logo-orb" aria-hidden="true">
                    <span>JM</span>
                    <small>Automation · Learning · Making</small>
                </div>

                <blockquote class="quote-box">
                    <p id="quoteText">把问题说清楚，答案自然会出现。</p>
                    <button id="changeQuote" class="text-button" type="button">换一句引言</button>
                </blockquote>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-shell footer-inner">
            <p>© <span class="current-year"></span> Jia Mingyuan. Built for GitHub Pages.</p>
            <div class="footer-links">
                <a href="https://github.com/jmy-idea" target="_blank" rel="noreferrer">GitHub</a>
                <a href="mailto:jmy23@mails.tsinghua.edu.cn">Email</a>
            </div>
        </div>
    </footer>

    <script src="personal_card.js"></script>
</body>
</html>
